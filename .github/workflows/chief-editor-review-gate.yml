name: Chief Editor Review Gate

on:
  workflow_dispatch:
    inputs:
      review_scope:
        description: "Issue, year, or publication surface being reviewed"
        required: true
        default: "historical-2025-temporary-model"
      review_note:
        description: "Short human review note"
        required: false
        default: ""

jobs:
  validate:
    name: Validate Review Surface
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python checks
        run: python -m pip install -r requirements.txt

      - name: Run Python checks
        run: pytest

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build publication surface
        run: bundle exec jekyll build --source site --destination /tmp/law-and-reasons-docs

      - name: Print review reminder
        run: |
          echo "Review scope: ${{ inputs.review_scope }}"
          echo "Review note: ${{ inputs.review_note }}"
          echo "This workflow validates the surface only. Durable approval must be recorded in chief_editor_decisions.md."
