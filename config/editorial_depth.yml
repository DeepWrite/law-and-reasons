name: "Law and Reasons editorial depth policy"
status: active
scope:
  - contemporary_quarterly_issues
  - historical_back_issues
  - model_issues
default_depth: top_tier_legal_philosophy_review
chief_editor: "Jeyoun Son"
core_standard:
  description: >
    Articles must aim at the analytical depth expected in leading Anglophone
    legal philosophy and legal theory reviews. They should be grounded in
    primary sources, current journal coverage, and historically responsible
    reconstruction rather than prompt-level summary.
  required_contexts:
    - "Representative work in leading jurisprudence journals, including Law and Philosophy, Legal Theory, Oxford Journal of Legal Studies, Jurisprudence, Ratio Juris, Canadian Journal of Law and Jurisprudence, and adjacent top generalist law reviews when the topic is jurisprudential."
    - "Canonical books and articles by representative legal philosophers in the relevant subfield."
    - "Gerald J. Postema-style contextual reconstruction of twentieth-century common-law jurisprudence where historically relevant."
    - "Stanford Encyclopedia of Philosophy-level field mapping for basic terrain, with primary literature doing the argumentative work."
    - "Chief Editor publications where they are directly relevant to the issue's jurisprudential question."
topic_priority:
  primary:
    - legal philosophy
    - legal theory
    - analytic jurisprudence
    - legal positivism after Hart
    - authority and reasons
    - interpretivism
    - natural law theory
    - rule of law
    - rights theory
    - legal reasoning
    - German and European legal theory
  admissible_when_jurisprudential:
    - AI, computation, and legal reasoning
    - empirical jurisprudence
    - platform governance
    - transnational legality
  exclusion_rule: >
    Do not exclude an applied or technological topic merely because it is
    contemporary. Include it only when leading legal philosophers or top-tier
    legal philosophy journals treat it as bearing on core jurisprudential
    questions such as authority, reasons, interpretation, responsibility,
    legal content, legality, or rights.
evidence_rules:
  - "Prefer official journal pages, publisher pages, primary books, articles, and verified local author files."
  - "Do not claim full-text analysis where only metadata, abstracts, tables of contents, or reviews are available."
  - "Mark access level and analysis level for each work used in historical reconstruction."
  - "Separate time-situated claims from retrospective judgment."
  - "Treat recent works as evidence of current attention only when their venue, author, topic, or reception supports that inference."
publication_rule:
  model_issue_may_be_temporarily_approved: true
  permanent_publication_requires_chief_editor_approval: true
  korean_translation_requires_separate_approval: true
korean_translation_policy:
  status: active
  governing_policy_path: "/Users/jeyounson/GithubRepo/source-library/docs/source-translation-policy-2026-06-07.md"
  local_policy_path: "editorial/korean_translation_policy.md"
  default_rule: "Preserve source distinctions in Korean unless a recorded source-level or issue-level reason justifies collapsing them."
  regression_guards:
    - "reason / reasons / Reason"
    - "law / the law / a law / laws"
    - "source / foundation / basis / ground / reference"
    - "rule of recognition -> 승인 규칙"
    - "internal point of view -> 내부적 관점"
    - "legal validity -> 법적 유효성"
    - "obligation / duty / being obliged -> 의무 / 책무 / 하지 않을 수 없음"
    - "Hohfeldian or Hartian power -> 권한"
    - "uptake -> 화행적수인; Hartian acceptance -> 수용"
    - "correctness / rightness / validity / justification / legitimacy"
